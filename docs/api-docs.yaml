openapi: 3.0.1
info:
  title: Bank Cards API
  description: API для управления банковскими картами и пользователями
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Аутентификация
  description: API для аутентификации пользователей
- name: "Пользователь: Карты"
  description: API для работы с картами пользователя (только USER)
- name: "Админ: Пользователи"
  description: API для управления пользователями (только ADMIN)
- name: "Админ: Карты"
  description: API для управления картами (только ADMIN)
paths:
  /api/admin/users/{userId}/role:
    put:
      tags:
      - "Админ: Пользователи"
      summary: Обновить роль пользователя
      operationId: updateRole
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: role
        in: query
        required: true
        schema:
          type: string
          description: Роль пользователя в системе
          enum:
          - USER
          - ADMIN
      responses:
        "404":
          description: Пользователь не найден
        "200":
          description: Роль обновлена
        "400":
          description: Недопустимая роль
  /api/admin/cards/{cardId}/activate:
    put:
      tags:
      - "Админ: Карты"
      summary: Активировать карту
      operationId: activateCard
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Карта активирована
        "404":
          description: Карта не найдена
  /api/user/cards/{cardId}/block:
    post:
      tags:
      - "Пользователь: Карты"
      summary: Заблокировать свою карту
      operationId: blockCard
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Карта не найдена
        "200":
          description: Карта заблокирована
        "403":
          description: Карта не принадлежит пользователю
  /api/user/cards/transfer:
    post:
      tags:
      - "Пользователь: Карты"
      summary: Перевести средства между своими картами
      operationId: transfer
      parameters:
      - name: fromCardId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: toCardId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: amount
        in: query
        required: true
        schema:
          type: number
          format: double
      responses:
        "400":
          description: Некорректная сумма или ID карт
        "404":
          description: Карта не найдена
        "409":
          description: Недостаточно средств
        "403":
          description: Карты не принадлежат пользователю
        "200":
          description: Перевод выполнен
  /api/auth/login:
    post:
      tags:
      - Аутентификация
      summary: Вход пользователя
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
        required: true
      responses:
        "200":
          description: Успешная аутентификация
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JwtResponse"
  /api/admin/users:
    post:
      tags:
      - "Админ: Пользователи"
      summary: Создать нового пользователя
      operationId: createUser
      parameters:
      - name: password
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
        required: true
      responses:
        "201":
          description: Пользователь создан
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Логин занят или некорректные данные
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/admin/cards:
    get:
      tags:
      - "Админ: Карты"
      summary: Получить все карты с пагинацией
      operationId: getAllCards
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "403":
          description: Доступ запрещён (не ADMIN)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageCardResponse"
        "200":
          description: Список карт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
    post:
      tags:
      - "Админ: Карты"
      summary: Создать новую карту
      operationId: createCard
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCreateRequest"
        required: true
      responses:
        "404":
          description: Пользователь не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "400":
          description: Некорректные данные карты
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
        "201":
          description: Карта создана
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardResponse"
  /api/user/cards:
    get:
      tags:
      - "Пользователь: Карты"
      summary: Получить свои карты с пагинацией
      operationId: getUserCards
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Список карт пользователя
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageCardResponse"
        "400":
          description: Некорректный ID пользователя
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageCardResponse"
  /api/admin/users/{userId}:
    get:
      tags:
      - "Админ: Пользователи"
      summary: Получить пользователя по ID
      operationId: getUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Пользователь не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "200":
          description: Пользователь найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    delete:
      tags:
      - "Админ: Пользователи"
      summary: Удалить пользователя
      operationId: deleteUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Пользователь удалён
        "404":
          description: Пользователь не найден
  /api/admin/cards/{cardId}:
    delete:
      tags:
      - "Админ: Карты"
      summary: Удалить карту
      operationId: deleteCard
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Карта удалена
        "404":
          description: Карта не найдена
components:
  schemas:
    AuthRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          type: string
          description: Логин пользователя
          example: ivan.ivanov
        password:
          type: string
          description: Пароль пользователя
          example: password123
      description: Данные для аутентификации пользователя
    JwtResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT-токен
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      description: Ответ после успешной аутентификации
    UserCreateRequest:
      required:
      - username
      type: object
      properties:
        username:
          type: string
          description: Логин пользователя (уникальный)
          example: ivan.ivanov
      description: DTO для создания пользователя системы
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          description: Уникальный идентификатор пользователя
          format: int64
          example: 1
        username:
          type: string
          description: Логин пользователя
          example: ivan.ivanov
        roles:
          uniqueItems: true
          type: array
          description: Роли пользователя в системе
          example: USER
          items:
            type: string
            description: Роль пользователя в системе
            example: USER
            enum:
            - USER
            - ADMIN
      description: DTO для представления пользователя системы
    CardCreateRequest:
      required:
      - expirationDate
      - number
      - owner
      type: object
      properties:
        number:
          pattern: "^\\d{4} \\d{4} \\d{4} \\d{4}$"
          type: string
          description: Номер банковской карты
          example: 1111 2222 3333 4444
        owner:
          pattern: "^[а-яА-ЯёЁ\\s]+$"
          type: string
          description: Владелец карты
          example: Иван Иванов
        expirationDate:
          pattern: "^(0[1-9]|1[0-2])\\/\\d{4}$"
          type: string
          description: Срок действия карты
          example: 12/2025
        balance:
          type: number
          description: Баланс карты
          example: 1000.5
      description: DTO для создания банковской карты
    CardResponse:
      type: object
      properties:
        id:
          type: integer
          description: ID карты
          format: int64
          example: 1
        maskedNumber:
          type: string
          description: Номер банковской карты (замаскированный)
          example: '**** **** **** 4444'
        owner:
          type: string
          description: Владелец карты
          example: Иван Иванов
        expirationDate:
          type: string
          description: Срок действия карты
          example: 12/2025
        status:
          type: string
          description: Статус карты
          example: ACTIVE
          enum:
          - ACTIVE
          - BLOCKED
          - EXPIRED
        balance:
          type: number
          description: Баланс карты
          example: 1000.5
      description: DTO для ответа с данными банковской карты
    Pageable:
      type: object
      properties:
        page:
          minimum: 0
          type: integer
          format: int32
        size:
          minimum: 1
          type: integer
          format: int32
        sort:
          type: array
          items:
            type: string
    PageCardResponse:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/CardResponse"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    Page:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            type: object
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
